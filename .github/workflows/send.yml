name: Send Reminders

on:
  workflow_dispatch:

concurrency:
  group: wa-session
  cancel-in-progress: false

permissions: {}

jobs:
  drain:
    name: Drain Outbox
    if: vars.BOT_DEPLOYMENT == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
    outputs:
      state-sha: ${{ steps.fetch.outputs.sha }}
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Fetch state branch
        id: fetch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir state
          git -C state init --quiet --initial-branch=state
          git -C state remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          if git -C state -c "http.extraheader=AUTHORIZATION: basic ${auth}" fetch --quiet --depth=1 origin state; then
            git -C state checkout --quiet -B state FETCH_HEAD
            echo "sha=$(git -C state rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            echo "state branch not found, starting empty"
            git -C state checkout --quiet --orphan state
            echo "sha=" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: sender/go.mod
          cache: true
          cache-dependency-path: sender/go.sum

      - name: Drain the outbox
        working-directory: sender
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          SENDER_TOKEN: ${{ secrets.SENDER_TOKEN }}
          AGE_IDENTITY: ${{ secrets.AGE_IDENTITY }}
          ANNOUNCE_JID: ${{ secrets.ANNOUNCE_JID }}
        run: go run ./cmd/wa drain --state "$GITHUB_WORKSPACE/state"

      - name: Detect state changes
        id: changes
        if: always()
        run: |
          set -euo pipefail
          changed=false
          if [ -d state/.git ] && [ -n "$(git -C state status --porcelain -- session.db.age sent.json)" ]; then
            changed=true
          fi
          echo "changed=${changed}" >> "$GITHUB_OUTPUT"

      - name: Upload state
        if: always() && steps.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: state
          path: |
            state/session.db.age
            state/sent.json
          if-no-files-found: error
          retention-days: 1

  persist:
    name: Persist State
    needs: drain
    if: always() && needs.drain.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download state
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: state
          path: state

      - name: Push state branch
        working-directory: state
        env:
          GH_TOKEN: ${{ github.token }}
          STATE_SHA: ${{ needs.drain.outputs.state-sha }}
        run: |
          set -euo pipefail
          [[ "$STATE_SHA" =~ ^([0-9a-f]{40})?$ ]] || { echo "invalid state commit: ${STATE_SHA}"; exit 1; }
          git init --quiet --initial-branch=state
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          files=()
          for f in session.db.age sent.json; do [ -e "$f" ] && files+=("$f"); done
          git add -- "${files[@]}"
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit --quiet -m "state"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.extraheader=AUTHORIZATION: basic ${auth}" \
              push --force-with-lease="refs/heads/state:${STATE_SHA}" origin HEAD:refs/heads/state
